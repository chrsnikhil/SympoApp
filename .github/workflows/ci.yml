name: CI

# Gate every PR on typecheck, build and a Docker build. Deployment is separate.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build, image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install system dependencies (libvips for sharp)
        # Must run before npm install so sharp can link against libvips during install
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libvips-dev build-essential python3

      - name: Clean install dependencies
        # All platform-specific native binaries are listed in optionalDependencies
        # in package.json. A fresh npm install ensures they resolve for linux-x64.
        run: |
          rm -rf node_modules
          npm install
          # Fallback: explicitly install the oxide binary if npm skipped it
          npm install --no-save @tailwindcss/oxide-linux-x64-gnu@4.3.3 || true

      - name: Verify native bindings
        # Fail fast with a clear message if critical native binaries are missing
        run: |
          node -e "require('@tailwindcss/oxide'); console.log('✅ tailwind oxide OK')"
          node -e "require('sharp'); console.log('✅ sharp OK')"

      - name: Check for UTF-8 BOMs
        # A BOM in globals.css breaks the Tailwind build with an error that
        # points at neither the file nor the cause. Catch it here instead.
        run: npm run check:bom

      - name: Check no answers reach the client
        # The eslint rule that bans this existed already, and a client component
        # imported the reveal codes and shipped anyway — because CI never ran
        # lint, and `npm run lint` still reports 79 pre-existing errors, so it
        # cannot be made a gate without a cleanup nobody should attempt this
        # week. This checks the one thing that must never regress.
        run: npm run check:client-secrets

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        # Placeholders only — the build must never need real secrets, and this
        # job asserts that. If a build starts failing without them, something
        # is reaching for the database at build time.
        env:
          MONGODB_URI: mongodb://placeholder
          JWT_SECRET: ci-placeholder-not-a-real-secret
        run: npm run build

      - name: Build Docker image
        # --no-cache ensures no stale host node_modules bleed into the image.
        # Proves the Dockerfile still works before a deploy discovers it doesn't.
        run: docker build --no-cache -t xplore26-events:ci .
