name: CI

# Gate every PR on typecheck, build and a Docker build. Deployment is separate.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build, image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install system dependencies (libvips for sharp)
        # Must run before npm install so sharp can link against libvips during install
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libvips-dev build-essential python3

      - name: Clean install dependencies
        # npm ci has a known bug (#4828) where it skips platform-specific optional
        # packages (e.g. @tailwindcss/oxide-linux-x64-gnu). A clean npm install
        # resolves optional deps correctly for the current platform.
        run: |
          rm -rf node_modules
          npm install
          npm rebuild lightningcss --update-binary || true
          npm rebuild @tailwindcss/oxide --update-binary
          npm rebuild sharp --update-binary
          npm install --no-save @rollup/rollup-linux-x64-gnu || true
          npm rebuild @rollup/rollup-linux-x64-gnu --update-binary || true

      - name: Check for UTF-8 BOMs
        # A BOM in globals.css breaks the Tailwind build with an error that
        # points at neither the file nor the cause. Catch it here instead.
        run: npm run check:bom

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        # Placeholders only — the build must never need real secrets, and this
        # job asserts that. If a build starts failing without them, something
        # is reaching for the database at build time.
        env:
          MONGODB_URI: mongodb://placeholder
          JWT_SECRET: ci-placeholder-not-a-real-secret
        run: npm run build

      - name: Build Docker image
        # --no-cache ensures no stale host node_modules bleed into the image.
        # Proves the Dockerfile still works before a deploy discovers it doesn't.
        run: docker build --no-cache -t xplore26-events:ci .
