name: CI

# Gate every PR on typecheck, build and a Docker build. Deployment is separate.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build, image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Rebuild & ensure Tailwind oxide native binding
        run: |
          npm rebuild @tailwindcss/oxide --update-binary || true
          npm i @tailwindcss/oxide-linux-x64-gnu --no-save || true

      - name: Ensure sharp native binding for Next.js image optimization
        run: npm install --os=linux --cpu=x64 sharp --no-save

      - name: Check for UTF-8 BOMs
        # A BOM in globals.css breaks the Tailwind build with an error that
        # points at neither the file nor the cause. Catch it here instead.
        run: npm run check:bom

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        # Placeholders only — the build must never need real secrets, and this
        # job asserts that. If a build starts failing without them, something
        # is reaching for the database at build time.
        env:
          MONGODB_URI: mongodb://placeholder
          JWT_SECRET: ci-placeholder-not-a-real-secret
        run: npm run build

      - name: Build Docker image
        # Proves the Dockerfile still works before a deploy discovers it doesn't.
        run: docker build -t xplore26-events:ci .
