name: CI

# Gate every PR on typecheck, build and a Docker build. Deployment is separate.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build, image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Install system dependencies (libvips for sharp)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libvips-dev

      - name: Rebuild native bindings (tailwind oxide + sharp + rollup)
        run: |
          # tailwind oxide – fail fast if the platform binary cannot be installed
          npm rebuild @tailwindcss/oxide --update-binary
          npm install --no-save @tailwindcss/oxide-linux-x64-gnu@latest

          # sharp – rebuild to get the correct linux-x64 binary
          npm rebuild sharp --update-binary

          # rollup – rebuild to get the correct linux-x64 binary (optional)
          npm rebuild @rollup/rollup-linux-x64-gnu --update-binary || true
          npm install --no-save @rollup/rollup-linux-x64-gnu@latest || true

      - name: Check for UTF-8 BOMs
        # A BOM in globals.css breaks the Tailwind build with an error that
        # points at neither the file nor the cause. Catch it here instead.
        run: npm run check:bom

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        # Placeholders only — the build must never need real secrets, and this
        # job asserts that. If a build starts failing without them, something
        # is reaching for the database at build time.
        env:
          MONGODB_URI: mongodb://placeholder
          JWT_SECRET: ci-placeholder-not-a-real-secret
        run: npm run build

      - name: Build Docker image
        # Proves the Dockerfile still works before a deploy discovers it doesn't.
        run: docker build -t xplore26-events:ci .
